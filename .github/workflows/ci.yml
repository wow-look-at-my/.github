name: CI

on:
  push:

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save strip-json-comments@3
      - run: node .github/scripts/validate-config.js
