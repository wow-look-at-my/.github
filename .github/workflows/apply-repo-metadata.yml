name: Apply repo metadata

# Actuator workflow: pushes approved descriptions out to each repo. The branch +
# path filters are deliberate -- it must only run after a proposal PR is merged
# to master, never on the proposal branch.
on:
  push:
    branches: [master]
    paths: ['proposed-repo-metadata.json']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List changes without applying them'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/actions@typescript#latest
        with:
          # PAT needs Metadata: read + Administration: read and write across the org.
          secrets: ${{ toJSON(secrets) }}
          inputs: ${{ toJSON(inputs) }}
          file: .github/scripts/apply-repo-metadata.ts
