name: Propose repo metadata

# Governance workflow (not CI): scans every repo in the org and opens a PR that
# updates proposed-repo-metadata.json. Runs on a schedule + on demand.
on:
  schedule:
    - cron: '0 8 * * 1' # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    env:
      ORG: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # PAT (Metadata: read across the org) is needed to see every repo.
      - name: Fetch current repo metadata across the org
        env:
          GH_TOKEN: ${{ secrets.REPO_METADATA_PAT }}
        run: gh repo list "$ORG" --no-archived --source --limit 1000 --json name,description > "$RUNNER_TEMP/current-repos.json"

      - name: Update proposed-repo-metadata.json
        run: node scripts/build-proposed-metadata.js "$RUNNER_TEMP/current-repos.json" proposed-repo-metadata.json

      # The PR is opened against THIS repo, so the default GITHUB_TOKEN suffices.
      - name: Open or update proposal PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/open-proposal-pr.sh
