name: Propose repo metadata

# Governance workflow (not CI): scans every repo in the org and opens a PR that
# updates proposed-repo-metadata.json. Runs on a schedule + on demand.
on:
  schedule:
    - cron: '0 8 * * 1' # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/actions@typescript#latest
        with:
          # secrets.REPO_METADATA_PAT (Metadata: read) lists every org repo;
          # secrets.GITHUB_TOKEN opens the PR against this repo.
          secrets: ${{ toJSON(secrets) }}
          file: .github/scripts/propose-repo-metadata.ts
